name: flashida-ci

on:
  push:
    branches: [main, develop, flashida-v9-migration, 'phase-*', 'august_pre']
  pull_request:
    branches: [main, develop, flashida-v9-migration]

jobs:
  # ----------------------------------------------------------------
  # Build OpenMS ONCE on windows-2022 (MSVC + Qt 6.8.3, matches the
  # committed-DLL toolchain). Two outputs from one compile:
  #   1. OpenMS.dll (+ OpenSwathAlgo/Qt6) -> artifact 'openms-fresh-dll',
  #      swapped into FlashIDA/dll/ by windows-tests (bridge/ABI drift).
  #   2. The 13 FLASH C++ test exes (same Release build dir)
  #      -> artifact 'cpp-test-build', executed by cpp-tests via ctest.
  # Ported from OpenMS/.github/workflows/build_dlls.yml. Plain CMake, Release.
  # ----------------------------------------------------------------
  build:
    runs-on: windows-2022
    steps:
      # submodules: true (NOT recursive) — we need the OpenMS source at the
      # pinned SHA, but OpenMS's nested 'contrib' submodule must stay empty so
      # the prebuilt contrib tarball extracts into a clean dir (mirrors
      # build_dlls.yml, which never recursively checks out contrib). Recursive
      # would overlay the contrib *source* tree under the tarball and can break
      # find_package(XercesC/Boost/...).
      - uses: actions/checkout@v4
        with:
          submodules: true

      - id: extract_branch
        name: Extract branch/PR infos
        shell: bash
        run: echo "RUN_NAME=${{ github.event.pull_request && github.event.number || github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Emulate a Visual Studio shell
        uses: egor-tensin/vs-shell@v2
        with:
          # NOTE: x64 is hardcoded. No support for 32bit
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: 'false'
          archives: 'qtsvg qtimageformats qtbase'

      - name: Install build tools
        shell: bash
        run: |
          choco install ninja cmake ccache 7zip eigen -y --no-progress
          # GH CLI "SHOULD BE" installed; ensure it is on PATH for contrib download.
          echo "C:\Program Files (x86)\GitHub CLI" >> $GITHUB_PATH
          echo "eigen_choco=C:\ProgramData\chocolatey\lib\eigen\share\cmake" >> $GITHUB_ENV

      - name: Cache contrib
        id: cache-contrib
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/OpenMS/contrib
          key: ${{ runner.os }}-contrib3

      - name: Download contrib build from archive
        if: steps.cache-contrib.outputs.cache-hit != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p OpenMS/contrib
          cd OpenMS/contrib
          gh release download -R OpenMS/contrib --pattern 'contrib_build-Windows.tar.gz'
          7z x -so contrib_build-Windows.tar.gz | 7z x -si -ttar
          rm contrib_build-Windows.tar.gz
          ls -la

      - name: Setup ccache cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-${{ runner.arch }}-ccache-${{ steps.extract_branch.outputs.RUN_NAME }}-${{ github.run_number }}
          # Restoring: From current branch/PR, otherwise from nightly, otherwise from any branch.
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ccache-${{ steps.extract_branch.outputs.RUN_NAME }}
            ${{ runner.os }}-${{ runner.arch }}-ccache-nightly
            ${{ runner.os }}-${{ runner.arch }}-ccache-

      - name: Configure OpenMS (CMake, Ninja, Release)
        shell: bash
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_MAXSIZE: 400M
          CCACHE_COMPILERCHECK: content
          CCACHE_SLOPPINESS: time_macros,include_file_ctime,include_file_mtime
        run: |
          cmake -S OpenMS -B OpenMS/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_GUI=OFF \
            -DPYOPENMS=OFF \
            -DBOOST_USE_STATIC=ON \
            -DOPENMS_CONTRIB_LIBS="${{ github.workspace }}/OpenMS/contrib" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR/lib/cmake;$QT_ROOT_DIR" \
            -DEigen3_DIR="$eigen_choco" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build OpenMS library
        shell: bash
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_MAXSIZE: 400M
          CCACHE_COMPILERCHECK: content
          CCACHE_SLOPPINESS: time_macros,include_file_ctime,include_file_mtime
        run: |
          cmake --build OpenMS/build --target OpenMS

      - name: Collect fresh DLLs
        shell: bash
        run: |
          mkdir -p openms-fresh-dll
          # OpenMS.dll + OpenSwathAlgo.dll land in the build's bin/ output dir
          # (CMAKE_RUNTIME_OUTPUT_DIRECTORY = <build>/bin; Release => no 'd' postfix).
          cp OpenMS/build/bin/OpenMS.dll openms-fresh-dll/
          cp OpenMS/build/bin/OpenSwathAlgo.dll openms-fresh-dll/
          # Qt6 runtime DLLs from the Qt install bin.
          cp "$QT_ROOT_DIR/bin/Qt6Core.dll" openms-fresh-dll/
          cp "$QT_ROOT_DIR/bin/Qt6Network.dll" openms-fresh-dll/
          ls -la openms-fresh-dll

      - name: Upload fresh DLLs artifact
        uses: actions/upload-artifact@v4
        with:
          name: openms-fresh-dll
          path: openms-fresh-dll/

      # --- Continue the SAME Release build: the 13 FLASH C++ test exes ---
      # class_tests are already configured (PACKAGE_TYPE=none default +
      # ENABLE_CLASS_TESTING default ON); only --target OpenMS was built above.
      # Do NOT pass ENABLE_CLASS_TESTING:OFF (build_dlls.yml does — must not copy).
      # Each exe lands in OpenMS/build/bin (CMAKE_RUNTIME_OUTPUT_DIRECTORY).
      - name: Build FLASH C++ test binaries
        shell: bash
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_MAXSIZE: 400M
          CCACHE_COMPILERCHECK: content
          CCACHE_SLOPPINESS: time_macros,include_file_ctime,include_file_mtime
        run: |
          cmake --build OpenMS/build --target \
            DeconvolvedSpectrum_OptimizationMetadata_test \
            FLASHIdaQueueTracking_test \
            FLASHIda_ProcessScan_test \
            ScanCommandLayout_test \
            FLASHIdaFAIMS_test \
            FLASHIda_exploration_test \
            FLASHIda_LegacyConfig_test \
            ConfigSchemaParity_test \
            FLASHIda_Logging_test \
            FLASHIda_LoggingFields_test \
            ScanCommandQueue_Concurrent_test \
            FragmentAnalysis_test \
            FragmentAnalysis_toProForma_test \
            MS3FragmentMatcher_test \
            MS3FragmentMatcher_identification_test \
            FLASHIda_ChargeBasedExclusion_test \
            ScanConfig_applyOverrides_test \
            Config_SchemaProjection_test \
            ProteoformTracker_CEOptimization_test \
            ProteoformTracker_Trajectory_test \
            ProteoformTracker_Localization_test \
            ProteoformTracker_WinnerContext_test \
            ProteoformTracker_NonWinnerRematch_test

      # --- Stage ALL runtime DLLs next to the test exes ---
      # Test exes live in OpenMS/build/src/tests/class_tests/bin/ (the OpenMS
      # test RUNTIME_OUTPUT_DIRECTORY override: src/tests/class_tests/CMakeLists.txt:16
      # + cmake/add_library_macros.cmake), NOT OpenMS/build/bin (library output).
      # The build already copies OpenMS.dll + OpenSwathAlgo.dll into the test bin;
      # add Qt6 + zlib (and re-copy the OpenMS pair as cheap insurance) so every
      # runtime dep sits beside the exes. zlib.dll is OpenMS.dll's own load-time
      # dep (the proven 5-DLL set that windows-tests ships from FlashIDA/dll/).
      - name: Stage runtime DLLs next to the test exes
        shell: bash
        run: |
          TBIN=OpenMS/build/src/tests/class_tests/bin
          ls -la "$TBIN"/*.exe          # guard: fail loudly if the exes aren't here
          cp OpenMS/build/bin/OpenMS.dll        "$TBIN"/
          cp OpenMS/build/bin/OpenSwathAlgo.dll "$TBIN"/
          cp "$QT_ROOT_DIR/bin/Qt6Core.dll"     "$TBIN"/
          cp "$QT_ROOT_DIR/bin/Qt6Network.dll"  "$TBIN"/
          cp FlashIDA/dll/zlib.dll              "$TBIN"/   # OpenMS.dll load-time dep
          ls -la "$TBIN"/*.dll

      # --- Package the build tree for ctest (single tarball, no object files) ---
      # Robust handoff: keeps every exe, DLL, CTestTestfile.cmake and
      # DartConfiguration.tcl wherever CMake placed them; drops the multi-GB
      # object/lib/pdb intermediates ctest never reads.
      - name: Package cpp-test-build tarball
        shell: bash
        run: |
          tar czf cpp-test-build.tgz -C OpenMS \
            --exclude='*.obj' --exclude='*.o' --exclude='*.lib' --exclude='*.a' \
            --exclude='*.pdb' --exclude='*.ilk' --exclude='*.exp' \
            build
          echo "test exes in tarball:"; tar tzf cpp-test-build.tgz \
            | grep -E 'class_tests/bin/.*_test\.exe' | head

      - name: Upload cpp-test-build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpp-test-build
          path: cpp-test-build.tgz

  # ----------------------------------------------------------------
  # C# unit tests + regression + bridge verification — windows-2022.
  # Pinned to windows-2022 to match the `build` job toolchain, so the
  # freshly built OpenMS.dll's MSVC/OpenMP (vcomp140) runtime deps are
  # guaranteed present on the test host.
  # Requires Thermo DLLs (build only) + OpenMS DLLs (runtime).
  # ----------------------------------------------------------------
  windows-tests:
    runs-on: windows-2022
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # --- Swap in the freshly built OpenMS DLLs (drift detection) ---
      # Overwrite the committed FlashIDA/dll/* with the fresh build from the
      # pinned OpenMS submodule SHA. zlib.dll is intentionally left committed.
      # CopyToOutputDirectory=PreserveNewest carries these into bin/ at build.
      - name: Download fresh OpenMS DLLs
        uses: actions/download-artifact@v4
        with:
          name: openms-fresh-dll
          path: openms-fresh-dll

      - name: Swap fresh OpenMS DLLs into FlashIDA/dll
        shell: powershell
        run: |
          Copy-Item openms-fresh-dll\OpenMS.dll       FlashIDA\dll\OpenMS.dll -Force
          Copy-Item openms-fresh-dll\OpenSwathAlgo.dll FlashIDA\dll\OpenSwathAlgo.dll -Force
          Copy-Item openms-fresh-dll\Qt6Core.dll      FlashIDA\dll\Qt6Core.dll -Force
          Copy-Item openms-fresh-dll\Qt6Network.dll   FlashIDA\dll\Qt6Network.dll -Force
          Write-Host "Swapped fresh OpenMS DLLs into FlashIDA\dll (zlib.dll left committed)."

      # --- Restore Thermo iAPI DLLs (proprietary, encrypted in repo) ---
      # Strategy B: openssl-encrypted zip committed to repo, passphrase in secret.
      # See testing-strategy.md Section 3.3 for setup instructions.
      - name: Restore Thermo iAPI DLLs
        shell: bash
        env:
          THERMO_DLL_PASSPHRASE: ${{ secrets.THERMO_DLL_PASSPHRASE }}
        run: |
          openssl enc -aes-256-cbc -d -pbkdf2 \
            -in FlashIDA/dependencies/thermo-dlls.zip.enc \
            -out thermo-dlls.zip \
            -pass pass:"$THERMO_DLL_PASSPHRASE"
          unzip -o thermo-dlls.zip -d FlashIDA/dependencies/
          rm thermo-dlls.zip
          echo "Restored Thermo DLLs:"
          ls FlashIDA/dependencies/*.dll

      # OpenMS DLLs are committed in FlashIDA/dll/ and copied to
      # build output by MSBuild (CopyToOutputDirectory in Flash.csproj).
      # No download or cache step needed.

      # --- Build ---
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore FlashIDA/src/Flash.sln

      - name: Build solution (Debug)
        run: |
          msbuild FlashIDA/src/Flash.sln /p:Configuration=Debug /p:Platform="Any CPU" /m

      # Copy Thermo DLLs to build output for Flash.exe runtime
      - name: Copy Thermo DLLs to build output
        shell: powershell
        run: |
          Copy-Item FlashIDA\dependencies\*.dll FlashIDA\bin\ -Force

      # --- Unit tests (NUnit) ---
      # The whole suite runs unfiltered: no --where, no category filter. CT35/CT36
      # (P4_AL_CT35/CT36 MS3 Mode1/Mode2 MS2-return pipeline) were once excluded as data-dependent
      # and flaky across engine bumps, which left continuity_ms3_mode1_real.json / _mode2_real.json
      # un-regenerable because those two tests are their sole writers. Both are re-enabled and
      # green, and both goldens have since been recaptured: 28 entries each, ActivationType=HCD,
      # CollisionEnergy=30, HcdEnergy=30 (MsnLevel 2:25, 3:3). Do not re-add an exclusion here
      # without also arranging for those goldens to stay regenerable.
      - name: Run NUnit tests
        env:
          OPENMS_DATA_PATH: ${{ github.workspace }}/OpenMS/share/OpenMS
        run: |
          FlashIDA\src\packages\NUnit.ConsoleRunner.3.16.3\tools\nunit3-console.exe FlashIDA\bin\Flash.Tests.dll --result=TestResults.xml --agents=1 --timeout=300000

      - name: Upload NUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nunit-results
          path: TestResults.xml

      # --- Config schema reference capture (ConfigSchemaParityTests.Reference_IsNeverStale) ---
      # config_schema_reference.json is produced by a TEST, not a tool, and must never be hand
      # edited. A local build cannot produce it either: there are no restored NuGet packages, no
      # net48 reference assemblies, and the Thermo DLLs ship encrypted. So this is the only path
      # that exists, and it mirrors log-golden-capture: regenerate into an artifact, then promote
      # the artifact deliberately in its own commit.
      #
      # Ordering is load-bearing. This step runs AFTER the unfiltered suite above, never before.
      # REGEN_CONFIG_REFERENCE=1 makes Reference_IsNeverStale OVERWRITE the committed file and
      # Assert.Pass -- run first, it would rewrite the fixture under the gate's feet and the gate
      # would then pass against its own output, reporting green while the schema silently drifted.
      # Run second, the gate has already failed loudly on the real drift and this only captures
      # what the fix should be. `continue-on-error` because it must not turn a genuine test failure
      # into a second, confusing one.
      - name: Capture config schema reference
        if: always()
        continue-on-error: true
        env:
          REGEN_CONFIG_REFERENCE: '1'
          OPENMS_DATA_PATH: ${{ github.workspace }}/OpenMS/share/OpenMS
        run: |
          FlashIDA\src\packages\NUnit.ConsoleRunner.3.16.3\tools\nunit3-console.exe FlashIDA\bin\Flash.Tests.dll --where "test=='Flash.Tests.ConfigSchemaParityTests.Reference_IsNeverStale'" --result=RegenResults.xml --agents=1 --timeout=300000

      - name: Upload config schema reference capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-schema-reference-capture
          path: FlashIDA/test-data/config_schema_reference.json
          if-no-files-found: ignore

      # --- Golden capture (baseline) ---
      - name: Capture golden output
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path FlashIDA\test-output | Out-Null
          & FlashIDA\bin\Flash.exe FlashIDA\test-data\spectra\ms1_smoke_test.txt FlashIDA\test-output\baseline_phase0.tsv FlashIDA\test-data\configs\method_default.json

      - name: Upload golden capture
        uses: actions/upload-artifact@v4
        with:
          name: golden-capture
          path: FlashIDA/test-output/baseline_phase0.tsv

      # --- Phase 4: Golden capture for all 9 mode configs ---
      - name: Phase 4 golden capture (all modes)
        shell: powershell
        env:
          OPENMS_DATA_PATH: ${{ github.workspace }}/OpenMS/share/OpenMS
        run: |
          powershell FlashIDA\test-scripts\regression-runner.ps1 -FlashExe FlashIDA\bin\Flash.exe -TestDataDir FlashIDA\test-data -OutputDir FlashIDA\test-output\phase4-golden -captureMode

      - name: Upload Phase 4 golden capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-golden-capture
          path: FlashIDA/test-output/phase4-golden/phase4_*.tsv
          if-no-files-found: warn

      # --- Phase 1: JSON golden file capture ---
      - name: Verify JSON golden capture
        shell: powershell
        run: |
          $jsonDir = "FlashIDA\test-output\json"
          $missing = @()
          foreach ($f in 'config_default.json','config_full.json') {
              if (Test-Path "$jsonDir\$f") {
                  Write-Host "$f captured"
              } else {
                  $missing += $f
              }
          }
          if ($missing.Count -gt 0) {
              Write-Host "ERROR: JSON golden(s) not captured: $($missing -join ', ')"
              exit 1
          }

      - name: Upload JSON golden capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: json-golden-capture
          path: FlashIDA/test-output/json/
          if-no-files-found: warn

      - name: Verify test data directories
        shell: powershell
        run: |
          $configsDir = "FlashIDA\test-data\configs"
          if (-not (Test-Path "$configsDir\method_default.json")) {
              Write-Host "ERROR: method_default.json not found"
              exit 1
          }
          if (-not (Test-Path "$configsDir\method_json_roundtrip.json")) {
              Write-Host "ERROR: method_json_roundtrip.json not found (required for Phase 1 tests)"
              exit 1
          }
          Write-Host "Test data verification passed."

      # --- Continuity test golden capture ---
      - name: Upload continuity golden capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuity-golden-capture
          path: FlashIDA/bin/continuity-output/
          if-no-files-found: ignore

      # --- Log golden capture (FLASHIdaLogGolden_test) ---
      # The per-case <file>.normalized files ARE the golden content; on a fresh run the golden
      # tests fail "golden missing" — download this artifact and commit the normalized outputs to
      # FlashIDA/test-data/golden/logs/<case>/<file>.golden.tsv (or re-run with LOG_GOLDEN_CAPTURE=1).
      - name: Upload log golden capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-golden-capture
          path: FlashIDA/bin/log-golden-output/
          if-no-files-found: ignore

      # --- Regression tests ---
      - name: Run regression tests
        id: regression
        shell: powershell
        env:
          OPENMS_DATA_PATH: ${{ github.workspace }}/OpenMS/share/OpenMS
        run: |
          powershell FlashIDA\test-scripts\regression-runner.ps1 -FlashExe FlashIDA\bin\Flash.exe -TestDataDir FlashIDA\test-data -OutputDir FlashIDA\test-output *>&1 | Tee-Object -FilePath FlashIDA\test-output\regression-stdout.txt
          # Re-assert the child exit code explicitly (Tee-Object is a cmdlet and leaves
          # $LASTEXITCODE = the child powershell's code); don't rely on the GHA epilogue,
          # which a future trailing native command could silently reset.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload regression output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-output
          path: FlashIDA/test-output/

      # --- Bridge smoke test verification ---
      - name: Verify bridge smoke tests
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Fail closed: a missing result file means the NUnit step never produced results,
          # which is a failure of this gate, not a reason to skip.
          if (-not (Test-Path TestResults.xml)) {
              Write-Host "ERROR: TestResults.xml not found - NUnit run did not produce results; cannot verify bridge smoke tests."
              exit 1
          }
          [xml]$results = Get-Content TestResults.xml
          $tier2Tests = $results.SelectNodes("//test-case[contains(@classname,'BridgeSmokeTests')]")
          # Require that the bridge smoke tests actually ran (an empty match set = renamed
          # class / filtered category / aborted suite), and treat ANY non-Passed outcome
          # (Failed/Error/Inconclusive/Skipped) as a failure - not only 'Failed'.
          if ($tier2Tests.Count -lt 1) {
              Write-Host "ERROR: zero BridgeSmokeTests cases found in results - tests did not run."
              exit 1
          }
          $bad = $tier2Tests | Where-Object { $_.result -ne 'Passed' }
          if ($bad.Count -gt 0) {
              Write-Host "Bridge smoke tests not all passed:"
              $bad | ForEach-Object { Write-Host "  $($_.name): $($_.result)" }
              exit 1
          }
          Write-Host "Bridge smoke tests passed ($($tier2Tests.Count) cases)."

      # --- Regression: verify [TRACK-CREATE] entries in stdout ---
      # Phase 4+: ProcessScan now emits TRACK-CREATE for every MS2 command generated.
      # Both old bridge (shadow validation) and unified bridge paths produce entries.
      - name: Verify TRACK-CREATE entries in regression output
        # Run only when the regression step actually executed (success). If regression was skipped because an
        # upstream step (e.g. NUnit) failed, regression-stdout.txt is never written; skip this verify rather than
        # false-fail on the missing file. When regression DID run, the body below stays fail-closed (missing file
        # or zero [TRACK-CREATE] entries => exit 1).
        if: always() && steps.regression.outcome == 'success'
        shell: powershell
        run: |
          $regressionLog = "FlashIDA\test-output\regression-stdout.txt"
          if (-not (Test-Path $regressionLog)) {
              Write-Host "FAIL: regression stdout log not found ($regressionLog) - regression step did not run or produced no output; cannot verify [TRACK-CREATE]."
              exit 1
          }
          $trackLines = Select-String -Path $regressionLog -Pattern "\[TRACK-CREATE\]"
          Write-Host "Found $($trackLines.Count) [TRACK-CREATE] entries in regression output."
          if ($trackLines.Count -eq 0) {
              Write-Host "FAIL: zero [TRACK-CREATE] entries - unified bridge should produce tracking entries."
              exit 1
          }

      # --- Stress tests (Phase 3: activated) ---
      - name: Run stress tests
        shell: powershell
        run: |
          Write-Host "Stress tests run as part of NUnit test suite (CT31, CT32)."

  # ----------------------------------------------------------------
  # FLASH C++ unit tests — windows-2022, MSVC/Release. Reuses the test
  # exes built once in the `build` job (artifact cpp-test-build); runs in
  # parallel with windows-tests. Replaces the former ubuntu/GCC/Debug
  # cpp-unit-tests job. NOTE: Release compiles out OPENMS_PRECONDITION /
  # debug asserts — accepted coverage tradeoff for the production toolchain.
  # ----------------------------------------------------------------
  cpp-tests:
    runs-on: windows-2022
    needs: build
    steps:
      # submodules: true brings the FlashIDA submodule (tests read
      # ../../FlashIDA/test-data relative to cwd OpenMS/build) and
      # OpenMS/share/OpenMS (for OPENMS_DATA_PATH). NOT recursive — no build,
      # so OpenMS/contrib is not needed.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download cpp-test-build artifact
        uses: actions/download-artifact@v4
        with:
          name: cpp-test-build
          path: .

      - name: Unpack build tree
        shell: bash
        run: |
          tar xzf cpp-test-build.tgz -C OpenMS      # -> OpenMS/build/...
          ls -la OpenMS/build/src/tests/class_tests/bin/*.exe

      - name: Run FLASH C++ unit tests
        env:
          OPENMS_DATA_PATH: ${{ github.workspace }}/OpenMS/share/OpenMS
        run: ctest --test-dir OpenMS/build -R "DeconvolvedSpectrum_OptimizationMetadata|FLASHIdaQueueTracking|FLASHIda_ProcessScan|ScanCommandLayout|FLASHIdaFAIMS|FLASHIda_exploration|FLASHIda_LegacyConfig|ConfigSchemaParity|FLASHIda_LoggingFields|FLASHIda_Logging|ScanCommandQueue_Concurrent|FragmentAnalysis|MS3FragmentMatcher|FLASHIda_ChargeBasedExclusion|ScanConfig_applyOverrides|Config_SchemaProjection|ProteoformTracker_CEOptimization|ProteoformTracker_Trajectory|ProteoformTracker_Localization|ProteoformTracker_WinnerContext|ProteoformTracker_NonWinnerRematch" --output-on-failure
